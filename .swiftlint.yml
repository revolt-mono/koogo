parent_config: .build/checkouts/swift/Sources/AirbnbSwiftFormatTool/swiftlint.yml

custom_rules:
  display_locale:
    name: Display Locale
    regex: '\.formatted\(\s*(\)|date:|\.(number|dateTime|percent|currency|units|time)\b)'
    message: Render user-visible text with a format style that carries Locale.display.
    severity: error
