disabled_rules:
  - opening_brace
  - trailing_comma

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_multiline_strings: true

cyclomatic_complexity:
  ignores_case_statements: true

large_tuple:
  warning: 3
  error: 4

nesting:
  type_level:
    warning: 3

type_name:
  excluded:
    - ID

custom_rules:
  display_locale:
    name: Display Locale
    regex: '\.formatted\(\s*(\)|date:|\.(number|dateTime|percent|currency|units|time)\b)'
    message: Render user-visible text with a display-locale style from Shared/DisplayLocale.swift.
    severity: error
